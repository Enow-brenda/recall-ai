<style>

            backdrop-filter: blur(8px);
        }
        .modal-shadow {
            box-shadow: 0px 4px 20px rgba(79, 70, 229, 0.15);
        }
        
        /* Custom scrollbar for chat area */
        .chat-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #c6c6cd;
            border-radius: 4px;
        }
    </style>

<body class="bg-background text-on-surface font-sans h-screen w-screen overflow-hidden flex relative">
<!-- Mock Background Content (Blurred) -->
<div class="absolute inset-0 z-0 flex blur-sm opacity-60">
<!-- Sidebar Mock -->
<div class="w-64 bg-surface-container-low border-r border-outline-variant h-full p-sm hidden md:flex flex-col">
<div class="font-headline-sm text-headline-sm font-bold text-primary mb-md">Recall AI</div>
<div class="space-y-xs flex-grow">
<div class="flex items-center gap-xs p-xs rounded-lg text-on-surface font-bold bg-surface-container-high">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">chat_bubble</span>
<span class="font-label-md text-label-md">Memory Feed</span>
</div>
<div class="flex items-center gap-xs p-xs text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-label-md text-label-md">Recents</span>
</div>
</div>
</div>
<!-- Main Chat Mock -->
<div class="flex-grow flex flex-col items-center pt-xl px-margin-desktop">
<div class="w-full max-w-max-width-content space-y-md">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
<p class="font-body-md text-body-md">Here are your recent memories regarding the project launch.</p>
</div>
</div>
<div class="absolute bottom-lg w-full max-w-max-width-content px-margin-desktop">
<div class="bg-surface-container-lowest border border-outline-variant rounded-full h-12 w-full"></div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="absolute inset-0 z-50 flex items-center justify-center bg-surface-tint/20 backdrop-blur-md p-margin-mobile">
<!-- Help Pop-up Modal -->
<div class="bg-surface-container-lowest w-full max-w-[400px] rounded-2xl modal-shadow border border-outline-variant flex flex-col overflow-hidden animate-[scale-in_0.2s_ease-out]">
<!-- Header -->
<div class="flex items-center justify-between p-sm border-b border-outline-variant">
<h2 class="font-headline-sm text-headline-sm text-primary">Help &amp; Support</h2>
<button class="text-on-surface-variant hover:text-primary transition-colors p-base rounded-full hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-primary/20">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Body: Mini-chat -->
<div class="p-sm flex flex-col h-[300px]">
<!-- Chat History -->
<div class="flex-grow overflow-y-auto chat-scroll pr-base flex flex-col gap-sm pb-sm">
<!-- System/Agent Message -->
<div class="flex items-start gap-xs">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">support_agent</span>
</div>
<div class="bg-surface-container-low border border-outline-variant rounded-xl rounded-tl-sm p-xs max-w-[85%]">
<p class="font-body-sm text-body-sm text-on-surface">How can we help you today?</p>
</div>
</div>
<!-- Suggested Action Chips (Optional, adds to refined feel) -->
<div class="flex flex-wrap gap-base pl-[40px] pt-base">
<button class="bg-surface-bright border border-outline-variant px-xs py-base rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-low transition-colors">Bug Report</button>
<button class="bg-surface-bright border border-outline-variant px-xs py-base rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-low transition-colors">Billing Issue</button>
<button class="bg-surface-bright border border-outline-variant px-xs py-base rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-low transition-colors">Feature Request</button>
</div>
</div>
<!-- Input Area -->
<div class="mt-auto relative">
<input class="w-full bg-surface-bright border border-outline-variant rounded-xl py-xs pl-sm pr-[44px] font-body-sm text-body-sm text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-outline focus:ring-1 focus:ring-outline transition-shadow" placeholder="Describe your issue or worry..." type="text">
<button class="absolute right-[4px] top-[4px] bottom-[4px] w-8 flex items-center justify-center rounded-lg text-sunset-orange hover:bg-sunset-orange-tint transition-colors focus:outline-none">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>

<div class="bg-surface-container-low p-xs border-t border-outline-variant text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">We'll respond via email within 24 hours.</p>
</div>
</div>
